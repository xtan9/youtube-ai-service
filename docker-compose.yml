services:
  youtube-ai-service:
    build: .
    container_name: youtube-ai-service
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - VPS_API_KEY=${VPS_API_KEY}
      - PORT=3001
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
